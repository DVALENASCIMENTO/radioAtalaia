<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Rádio Atalaia</title>

  <!-- FAVICON -->
  <link rel="icon"
  type="image/png"
  href="assets/icon-192.png">

  <!-- ÍCONE IOS / ANDROID -->
  <link rel="apple-touch-icon"
  href="assets/icon-512.png">

  <!-- PWA -->
  <link rel="manifest"
  href="manifest.json">

  <!-- COR DO TEMA -->
  <meta name="theme-color"
  content="#0b1320">

  <!-- CSS -->
  <link rel="stylesheet"
  href="css/style.css">

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

  <div class="container">

    <!-- TOPO -->
    <header>

      <img
      src="assets/logo.png"
      class="logo"
      alt="Rádio Atalaia">

      <h1>Rádio Atalaia</h1>

      <p class="subtitle">
        A Voz que Ecoa Esperança
      </p>

      <div class="radio-icon">
        <i class="fa-solid fa-radio"></i>
      </div>

    </header>

    <!-- PLAYER -->
    <section class="player">

      <div class="now-playing">

        <span>Tocando Agora:</span>

        <h2 id="musicName">
          Carregando...
        </h2>

      </div>

      <audio id="audio"></audio>

      <!-- CONTROLES -->
      <div class="controls">

        <button id="prevBtn">
          <i class="fa-solid fa-backward"></i>
        </button>

        <button id="playBtn">
          <i class="fa-solid fa-play"></i>
        </button>

        <button id="pauseBtn">
          <i class="fa-solid fa-pause"></i>
        </button>

        <button id="nextBtn">
          <i class="fa-solid fa-forward"></i>
        </button>

      </div>

      <!-- BARRA -->
      <div class="progress-area">

        <input
        type="range"
        id="progress"
        value="0"
        min="0"
        max="100">

      </div>

    </section>

<!-- COMPARTILHAR -->
<div class="share-area">

  <button id="shareBtn" class="contact-btn share-btn">

    <i class="fa-solid fa-share-nodes"></i>
    Compartilhar Rádio

  </button>

</div> 




<!-- PROJETOS -->
<div class="study-area">

      <!-- Ministério Atalaia -->
    <a href="https://dvalenascimento.github.io/ministerioAtalaia/" class="study-card" target="_blank">
        <img src="assets/banner_ministerioAtalaia.jpeg" alt="Ministério Atalaia">
        <span>Ministério Atalaia</span>
    </a>

        <!-- Escola Bíblica Atalaia -->
    <a href="https://dvalenascimento.github.io/escolaBiblicaAtalaia/" class="study-card" target="_blank">
        <img src="assets/bannerEBA.jpeg" alt="Escola Bíblica Atalaia">
        <span>Escola Bíblica Atalaia</span>
    </a>

        <!-- Discipulado Cristão -->
    <a href="https://dvalenascimento.github.io/discipuladoCristao/" class="study-card" target="_blank">
        <img src="assets/bannerHoriz_discCristao.png" alt="Discipulado Cristão">
        <span>Discipulado Cristão</span>
    </a>

        <!-- Seminário Teológico Atalaia -->
    <a href="https://dvalenascimento.github.io/seminarioTeologicoAtalaia/" class="study-card" target="_blank">
        <img src="assets/banner_STA.png" alt="Seminário Teológico Atalaia">
        <span>Seminário Teológico Atalaia</span>
    </a>

    <!-- Escola de Profetas Atalaia -->
    <a href="https://dvalenascimento.github.io/escoladeProfetasAtalaia/" class="study-card" target="_blank">
        <img src="assets/bannerHoriz_escoProf.png" alt="Escola de Profetas Atalaia">
        <span>Escola de Profetas Atalaia</span>
    </a>

    <!-- Bibliografia -->
    <a href="https://dvalenascimento.github.io/bibliografia_diego_nascimento/" class="study-card" target="_blank">
        <img src="assets/banner_editoraAtalaia.png" alt="Bibliografia">
        <span>Editora Atalaia</span>
    </a>

    <!-- Sermonografia -->
    <a href="https://dvalenascimento.github.io/sermonografia_diego_nascimento/" class="study-card" target="_blank">
        <img src="assets/banner_sermonografia.jpeg" alt="Sermonografia">
        <span>Sermonografia</span>
    </a>

    <!-- Shabat Shalom -->
    <a href="https://dvalenascimento.github.io/shabatShalom/" class="study-card" target="_blank">
        <img src="assets/banner_shabatShalom.jpeg" alt="Shabat Shalom">
        <span>Shabat Shalom</span>
    </a>


</div>



<!-- CONTATO -->
<section class="contact-section">

  <h3>Entre em contato:</h3>

  <div class="contact-buttons">

    <!-- EMAIL -->
    <a
    href="mailto:radioatalaiamanaus@gmail.com"
    class="contact-btn email-btn">

      <i class="fa-solid fa-envelope"></i>
      E-mail

    </a>

    <!-- INSTAGRAM -->
    <a
    href="https://www.instagram.com/radio.atalaiamanaus?igsh=bzM1NmtoN3ZxaDRx"
    target="_blank"
    class="contact-btn insta-btn">

      <i class="fa-brands fa-instagram"></i>
      Instagram

    </a>

  </div>

</section>

  </div>

  <!-- SCRIPT -->
  <script src="js/script.js"></script>

</body>
</html>
